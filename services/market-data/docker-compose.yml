# MD-1.10 — Local offline scaffold only.
# Usage: docker compose up --build
# Then: curl http://localhost:8080/health
#
# NO remote VPS host. NO deploy scripts.
services:
  market-data:
    build: .
    image: confluence-market-data:local
    ports:
      - "8080:8080"
    environment:
      MD_HOST: "0.0.0.0"
      MD_PORT: "8080"
    restart: unless-stopped
