[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-market-data"
version = "0.1.0"
description = "Phase 1 market-data scaffold (Binance public REST/WS + health HTTP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0,<14",
]

[project.optional-dependencies]
dev = []

[project.scripts]
market-data = "market_data.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
