<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" fill="none">
  <defs>
    <radialGradient id="voidGlow" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#060B14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cStroke" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="acry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowHair" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Production pack: H1 master inset to the 72dp adaptive safe zone on a 108dp canvas. -->
  <g transform="translate(18 18) scale(0.140625)">
    <rect width="512" height="512" rx="114" fill="url(#voidGlow)"/>
    <rect x="40" y="40" width="432" height="432" rx="94" fill="none" stroke="url(#acry)" stroke-width="1.25" opacity="0.45"/>
    <path d="M348 158 A132 132 0 1 0 348 354" stroke="#22D3EE" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.22"/>
    <g filter="url(#glowHair)" opacity="0.95">
