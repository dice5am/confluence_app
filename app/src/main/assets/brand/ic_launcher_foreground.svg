<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cStroke" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowHair" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Same 512 artboard as the locked mark. Mapped to 108dp so the C + rays
       already sit in the 72dp adaptive safe zone (original inner padding). -->
  <path d="M348 158 A132 132 0 1 0 348 354" stroke="#22D3EE" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.22"/>
  <g filter="url(#glowHair)" opacity="0.95">
    <path d="M108 188 C168 200, 214 236, 248 256" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M100 256 C168 256, 214 256, 248 256" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round"/>
    <path d="M108 324 C168 312, 214 276, 248 256" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <circle cx="250" cy="256" r="6" fill="#BAE6FD" filter="url(#glowSoft)"/>
  <path filter="url(#glowSoft)" d="M336 156
    C288 128, 214 134, 182 178
    C156 214, 156 298, 182 334
    C214 378, 288 384, 336 356"
    stroke="url(#cStroke)" stroke-width="30" stroke-linecap="round" fill="none"/>
</svg>
